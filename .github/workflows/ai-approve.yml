name: AI Auto-Approve Gate

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-gate:
    runs-on: ubuntu-latest
    # Skip drafts and fork PRs (secrets are unavailable to forks)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Evaluate Copilot Verdict
        # TODO: pin to a full commit SHA of the latest release
        uses: mheap/pr-auto-approve-copilot@v1
        with:
          # Fine-grained PAT of a dedicated bot account with "Pull requests: write"
          bot-token: ${{ secrets.GH_TOKEN }}
          bot-login: ${{ vars.GH_USERNAME }}
          base-branch: "main,develop"
          # Number of Copilot review rounds evaluated before approving
          rounds-threshold: 3
