name: AIClaudeWorker-CI-Docker

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aiclaudeworker-ci-docker.yml"
      - "aiteam/aiclaudeworker/**"
      - "aiteam/shared/**"
  pull_request:
    paths:
      - ".github/workflows/aiclaudeworker-ci-docker.yml"
      - "aiteam/aiclaudeworker/**"
      - "aiteam/shared/**"

jobs:
  build:
    name: Build Docker Image
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-server-ci.yml@v1.8
    with:
      project_path: "aiteam/aiclaudeworker"
      project_name: "ClaudeCodingAgent"
    secrets: inherit
