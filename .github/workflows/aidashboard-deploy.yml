name: AI Dashboard - Deploy

permissions:
  contents: read

on:
  release:
    types: [published]
  pull_request:
    types: [closed]
    branches: ["master", "main"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: aidashboard-deploy
  cancel-in-progress: false

jobs:
  staging:
    if: github.event.pull_request.merged == true || inputs.environment == 'staging' || inputs.environment == 'production' || github.event_name == 'release'
    name: Deploy to Staging
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-server-deploy.yml@v1.7
    with:
      environment: staging
      external_port: ${{ fromJSON(vars.AIDASHBOARD_STAGING_PORT) }}
      project_path: aiteam/aidashboard
      project_name: aidashboard
    secrets: inherit

  production:
    if: github.event.pull_request.merged == true || inputs.environment == 'production' || github.event_name == 'release'
    name: Deploy to Production
    needs: [staging]
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-server-deploy.yml@v1.7
    with:
      environment: production
      external_port: ${{ fromJSON(vars.AIDASHBOARD_PRODUCTION_PORT) }}
      project_path: aiteam/aidashboard
      project_name: aidashboard
    secrets: inherit
