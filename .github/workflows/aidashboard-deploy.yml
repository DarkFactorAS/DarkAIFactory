name: AI Dashboard - Deploy

permissions:
  contents: read

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/aidashboard-deploy.yml
      - aiteam/aidashboard/**
    types: [closed]
    branches: ["master", "main"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        default: production
        type: choice
        options:
          - production

concurrency:
  group: aidashboard-deploy
  cancel-in-progress: false

jobs:
  production:
    if: github.event.pull_request.merged == true || inputs.environment == 'production' || github.event_name == 'release'
    name: Deploy to Production
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-server-deploy.yml@v1.7
    with:
      environment: production
      external_port: ${{ fromJSON(vars.AIDASHBOARD_PRODUCTION_PORT) }}
      project_path: aiteam/aidashboard
      project_name: aidashboard
    secrets: inherit
