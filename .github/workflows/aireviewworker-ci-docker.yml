name: AIReviewWorker-CI-Docker

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aireviewworker-ci-docker.yml"
      - "aiteam/aireviewworker/**"
      - "aiteam/shared/**"
  pull_request:
    paths:
      - ".github/workflows/aireviewworker-ci-docker.yml"
      - "aiteam/aireviewworker/**"
      - "aiteam/shared/**"

jobs:
  build:
    name: Build Docker Image
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-docker-ci.yml@v1.8
    with:
      project_path: "aiteam/aireviewworker"
      project_name: "ReviewWorker"
    secrets: inherit
