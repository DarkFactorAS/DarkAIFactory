name: AITechLead-CI-Docker

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aitechlead-ci-docker.yml"
      - "aiteam/aimanager/**"
      - "aiteam/shared/**"
  pull_request:
    paths:
      - ".github/workflows/aitechlead-ci-docker.yml"
      - "aiteam/aimanager/**"
      - "aiteam/shared/**"

jobs:
  build:
    name: Build Docker Image
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-docker-ci.yml@v1.8
    with:
      project_path: "aiteam/aimanager"
      project_name: "ManagerAgent"
    secrets: inherit
