name: AIWorker-CI-Docker

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aiworker-ci-docker.yml"
      - "aiteam/aiworker/**"
      - "aiteam/shared/**"
  pull_request:
    paths:
      - ".github/workflows/aiworker-ci-docker.yml"
      - "aiteam/aiworker/**"
      - "aiteam/shared/**"

jobs:
  build:
    name: Build Docker Image
    uses: DarkFactorAS/Infrastructure/.github/workflows/infrastructure-docker-ci.yml@v1.8
    with:
      project_path: "aiteam/aiworker"
      project_name: "CodingAgent"
    secrets: inherit
