name: Manager-CI-DotNet

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build ManagerAgent (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        env:
          NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: dotnet restore aiteam/aimanager/src/ManagerAgent/ManagerAgent.csproj

      - name: Build
        run: dotnet build aiteam/aimanager/src/ManagerAgent/ManagerAgent.csproj --no-restore -c Release
