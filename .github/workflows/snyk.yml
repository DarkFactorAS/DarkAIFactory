name: Snyk

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Once per day (UTC). Skipped when main has no commits in the last 24 hours.
    - cron: "17 3 * * *"

concurrency:
  group: snyk
  cancel-in-progress: false

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for commits in the last 24 hours
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(git log --since="24 hours ago" --oneline origin/main | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No commits on main in the last 24 hours; skipping Snyk scan."
          fi

  snyk:
    name: Snyk dependency scan
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify SNYK_TOKEN
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Repository secret SNYK_TOKEN is not configured."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        env:
          NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          for p in aiteam/aiagent/tests/AiAgent.Tests/AiAgent.Tests.csproj \
                   aiteam/dbmigration/tests/dbmigration.Tests/dbmigration.Tests.csproj \
                   aiteam/aidashboard/aidashboard.csproj; do
            dotnet restore "$p"
          done

      - uses: snyk/actions/setup@v1.0.0

      - name: Snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high
