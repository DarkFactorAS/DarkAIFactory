services:
  dbmigration:
    build:
      context: ..
      dockerfile: aiteam/dbmigration/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      aiteam_database:
        condition: service_healthy
    volumes:
      - ${AITEAM_CONFIG_PATH:-./config}:/app/Config:ro
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  aiagent:
    build:
      context: ..
      dockerfile: aiteam/aiagent/Dockerfile
      target: orchestrator
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      dbmigration:
        condition: service_completed_successfully
      aiagent-runner:
        condition: service_healthy
    volumes:
      - ${AITEAM_CONFIG_PATH:-./config}:/app/Config:ro
      - aiagent_workspaces:/workspaces
    restart: "no"
    init: true
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      HOME: /tmp
      AIAGENT_WORKSPACE_ROOT: /workspaces
      AIAGENT_RUNNER_URL: http://aiagent-runner:8080/
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - aiagent-runner

  aiagent-runner:
    build:
      context: ..
      dockerfile: aiteam/aiagent/Dockerfile
      target: runner
      secrets:
        - nuget_username
        - nuget_token
    command: ["--runner-server"]
    volumes:
      # The runner receives only the CLI login and workspaces, never /app/Config.
      - aiteam_aiagent_claude_config:/claude-config
      - aiagent_workspaces:/workspaces
    restart: "no"
    init: true
    environment:
      HOME: /tmp
      CLAUDE_CONFIG_DIR: /claude-config
      AIAGENT_WORKSPACE_ROOT: /workspaces
      NUGET_USERNAME: ${NUGET_USERNAME}
      NUGET_TOKEN: ${NUGET_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - aiagent-runner

  aidashboard:
    build:
      context: ..
      dockerfile: aiteam/aidashboard/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      dbmigration:
        condition: service_completed_successfully
#    volumes:
#      - ${AIDASHBOARD_CONFIG_PATH:-./aidashboard/Config}:/app/Config:ro
    ports:
      - "127.0.0.1:${AIDASHBOARD_PORT:-8281}:8080"
    restart: "no"
    init: true
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  adminer:
    image: adminer:latest
    restart: "no"
    depends_on:
      aiteam_database:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: aiteam_database
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8280}:8080"
    security_opt:
      - no-new-privileges:true

  aiteam_database:
    image: mariadb:11
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-aiteam}
      MARIADB_USER: ${MARIADB_USER:-aiteam}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD}
    volumes:
      - aiteam_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8206:3306"

volumes:

  # docker volume create aiagent_workspaces
  aiagent_workspaces:
    name: ${AIAGENT_WORKSPACES_VOLUME_NAME:-aiteam_aiagent_workspaces}

  # Claude Code CLI login for the agent runner (see login_claude.sh)
  aiteam_aiagent_claude_config:
    name: ${AIAGENT_CLAUDE_CONFIG_VOLUME_NAME:-aiteam_aiagent_claude_config}

  # docker volume create aiteam_mariadb_data
  aiteam_mariadb_data:
    external: true
    name: ${MARIADB_VOLUME_NAME:-aiteam_mariadb_data}

secrets:
  nuget_username:
    environment: NUGET_USERNAME
  nuget_token:
    environment: NUGET_TOKEN

networks:
  aiagent-runner:
