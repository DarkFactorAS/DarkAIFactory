services:
  coding-agent:
    build:
      context: ..
      dockerfile: aiteam/aiworker/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    volumes:
      - ${AIWORKER_CONFIG_PATH:-./config/aiworker}:/app/Config:ro
    restart: unless-stopped
    init: true
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      HOME: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  manager-agent:
    build:
      context: ..
      dockerfile: aiteam/aimanager/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      aiteam_database:
        condition: service_healthy
    volumes:
      - ${AIMANAGER_CONFIG_PATH:-./config/aimanager}:/app/Config:ro
    restart: unless-stopped
    init: true
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      HOME: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      aiteam_database:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: aiteam_database
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8180}:8080"
    security_opt:
      - no-new-privileges:true

  aiteam_database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-aiteam}
      MARIADB_USER: ${MARIADB_USER:-aiteam}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD}
    volumes:
      - aiteam_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  # docker volume create aiteam_mariadb_data
  aiteam_mariadb_data:
    external: true
    name: ${MARIADB_VOLUME_NAME:-aiteam_mariadb_data}

secrets:
  nuget_username:
    environment: NUGET_USERNAME
  nuget_token:
    environment: NUGET_TOKEN
