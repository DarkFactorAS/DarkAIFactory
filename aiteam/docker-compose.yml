services:
  coding-agent:
    build:
      context: ..
      dockerfile: aiteam/aiworker/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    volumes:
      - ${AIWORKER_CONFIG_PATH:-./config/aiworker}:/app/Config:ro
    restart: unless-stopped
    init: true
    environment:
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-DFAI}
      JIRA_STATUS_NAME: ${JIRA_STATUS_NAME:-Selected for Development}
      JIRA_JQL: ${JIRA_JQL:-}
      JIRA_PICKUP_LABEL: ${JIRA_PICKUP_LABEL:-ai-agent-picked}
      JIRA_FAILURE_LABEL: ${JIRA_FAILURE_LABEL:-ai-agent-failed}
      JIRA_IN_PROGRESS_STATUS: ${JIRA_IN_PROGRESS_STATUS:-In Progress}
      JIRA_IN_REVIEW_STATUS: ${JIRA_IN_REVIEW_STATUS:-In Review}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      TARGET_REPOSITORY_URL: ${TARGET_REPOSITORY_URL:?Set TARGET_REPOSITORY_URL to the GitHub repository URL}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_REPOSITORY_TOKEN: ${GITHUB_REPOSITORY_TOKEN:-}
      HOME: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  manager-agent:
    build:
      context: ..
      dockerfile: aiteam/aimanager/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      aiteam_database:
        condition: service_healthy
    volumes:
      - ${AIMANAGER_CONFIG_PATH:-./config/aimanager}:/app/Config:ro
    restart: unless-stopped
    init: true
    environment:
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_STATUS_NAME: ${JIRA_STATUS_NAME:-Selected for Development}
      JIRA_JQL: ${JIRA_JQL:-}
      JIRA_PICKUP_LABEL: ${MANAGER_JIRA_PICKUP_LABEL:-ai-manager-planned}
      JIRA_ANALYZED_LABEL: ${JIRA_ANALYZED_LABEL:-ai-analyzed}
      JIRA_FAILURE_LABEL: ${MANAGER_JIRA_FAILURE_LABEL:-ai-manager-failed}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_REPOSITORY_TOKEN: ${GITHUB_REPOSITORY_TOKEN:-}
      HOME: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  aiteam_database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-aiteam}
      MARIADB_USER: ${MARIADB_USER:-aiteam}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD}
    volumes:
      - aiteam_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  # docker volume create aiteam_mariadb_data
  aiteam_mariadb_data:
    external: true
    name: ${MARIADB_VOLUME_NAME:-aiteam_mariadb_data}

secrets:
  nuget_username:
    environment: NUGET_USERNAME
  nuget_token:
    environment: NUGET_TOKEN
