services:
  dbmigration:
    build:
      context: ..
      dockerfile: aiteam/dbmigration/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      aiteam_database:
        condition: service_healthy
    volumes:
      - ${AITEAM_CONFIG_PATH:-./config}:/app/Config:ro
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  coding-agent:
    build:
      context: ..
      dockerfile: aiteam/aiworker/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      dbmigration:
        condition: service_completed_successfully
    volumes:
      - ${AITEAM_CONFIG_PATH:-./config}:/app/Config:ro
    restart: unless-stopped
    init: true
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      NUGET_USERNAME: ${NUGET_USERNAME}
      NUGET_TOKEN: ${NUGET_TOKEN}
      HOME: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  claude-coding-agent:
    build:
      context: ..
      dockerfile: aiteam/aiclaudeworker/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      dbmigration:
        condition: service_completed_successfully
      claude-cli:
        condition: service_healthy
    volumes:
      - ${AITEAM_CONFIG_PATH:-./config}:/app/Config:ro
      - claude_workspaces:/workspaces
    restart: unless-stopped
    init: true
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      HOME: /tmp
      CLAUDE_WORKSPACE_ROOT: /workspaces
      CLAUDE_RUNNER_URL: http://claude-cli:8080
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - claude-runner

  claude-cli:
    build:
      context: ..
      dockerfile: aiteam/aiclaudeworker/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    command: ["--claude-runner-server"]
    volumes:
      # The CLI runner receives only the checkout volume, never the worker's database configuration.
      - claude_config:/claude-config
      - claude_workspaces:/workspaces
    restart: unless-stopped
    init: true
    environment:
      HOME: /tmp
      CLAUDE_CONFIG_DIR: /claude-config
      CLAUDE_WORKSPACE_ROOT: /workspaces
      NUGET_USERNAME: ${NUGET_USERNAME}
      NUGET_TOKEN: ${NUGET_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - claude-runner

  manager-agent:
    build:
      context: ..
      dockerfile: aiteam/aimanager/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      dbmigration:
        condition: service_completed_successfully
    volumes:
      - ${AITEAM_CONFIG_PATH:-./config}:/app/Config:ro
    restart: unless-stopped
    init: true
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      HOME: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  jira-manager-agent:
    build:
      context: ..
      dockerfile: aiteam/aijiramanager/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      dbmigration:
        condition: service_completed_successfully
    volumes:
      - ${AITEAM_CONFIG_PATH:-./config}:/app/Config:ro
    restart: unless-stopped
    init: true
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      HOME: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  aiagent:
    build:
      context: ..
      dockerfile: aiteam/aiagent/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    restart: unless-stopped
    init: true
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  aidashboard:
    build:
      context: ..
      dockerfile: aiteam/aidashboard/Dockerfile
      secrets:
        - nuget_username
        - nuget_token
    depends_on:
      dbmigration:
        condition: service_completed_successfully
#    volumes:
#      - ${AIDASHBOARD_CONFIG_PATH:-./aidashboard/Config}:/app/Config:ro
    ports:
      - "127.0.0.1:${AIDASHBOARD_PORT:-8281}:8080"
    restart: unless-stopped
    init: true
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      aiteam_database:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: aiteam_database
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8280}:8080"
    security_opt:
      - no-new-privileges:true

  aiteam_database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-aiteam}
      MARIADB_USER: ${MARIADB_USER:-aiteam}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD}
    volumes:
      - aiteam_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8206:3306"

volumes:
  # docker volume create claude_config
  claude_config:
    name: ${CLAUDE_CONFIG_VOLUME_NAME:-aiteam_claude_config}
  # docker volume create claude_workspaces
  claude_workspaces:
    name: ${CLAUDE_WORKSPACES_VOLUME_NAME:-aiteam_claude_workspaces}
  # docker volume create aiteam_mariadb_data
  aiteam_mariadb_data:
    external: true
    name: ${MARIADB_VOLUME_NAME:-aiteam_mariadb_data}

secrets:
  nuget_username:
    environment: NUGET_USERNAME
  nuget_token:
    environment: NUGET_TOKEN

networks:
  claude-runner:
