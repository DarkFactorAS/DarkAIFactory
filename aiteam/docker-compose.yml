services:
  coding-agent:
    build:
      context: ./aiworker
    restart: unless-stopped
    init: true
    environment:
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-DFAI}
      JIRA_STATUS_NAME: ${JIRA_STATUS_NAME:-Selected for Development}
      JIRA_JQL: ${JIRA_JQL:-}
      JIRA_PICKUP_LABEL: ${JIRA_PICKUP_LABEL:-ai-agent-picked}
      JIRA_FAILURE_LABEL: ${JIRA_FAILURE_LABEL:-ai-agent-failed}
      JIRA_IN_PROGRESS_STATUS: ${JIRA_IN_PROGRESS_STATUS:-In Progress}
      JIRA_IN_REVIEW_STATUS: ${JIRA_IN_REVIEW_STATUS:-In Review}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      TARGET_REPOSITORY_URL: ${TARGET_REPOSITORY_URL:?Set TARGET_REPOSITORY_URL to the GitHub repository URL}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_REPOSITORY_TOKEN: ${GITHUB_REPOSITORY_TOKEN:-}
      HOME: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
