services:
  coding-agent:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-DFAI}
      JIRA_STATUS_NAME: ${JIRA_STATUS_NAME:-Selected for Development}
      JIRA_JQL: ${JIRA_JQL:-}
      JIRA_PICKUP_LABEL: ${JIRA_PICKUP_LABEL:-ai-agent-picked}
      JIRA_FAILURE_LABEL: ${JIRA_FAILURE_LABEL:-ai-agent-failed}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      GH_TOKEN: ${GH_TOKEN:-}
      WORKSPACE_PATH: /workspace/repository
    volumes:
      - type: bind
        source: ${TARGET_REPOSITORY_PATH:?Set TARGET_REPOSITORY_PATH to the target code repository}
        target: /workspace/repository
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
